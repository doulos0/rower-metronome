<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="26" fill="#101318"/>
  <rect x="4" y="4" width="120" height="120" rx="22" fill="none" stroke="#262D38" stroke-width="2"/>

  <!-- Concept2 Erg Silhouette -->
  <line x1="16" y1="88" x2="82" y2="88" stroke="#9AA6B8" stroke-width="4" stroke-linecap="round"/>
  <line x1="22" y1="89" x2="18" y2="104" stroke="#707A8A" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="78" y1="89" x2="98" y2="104" stroke="#707A8A" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="96" cy="80" r="16" fill="#1C212A" stroke="#808B9C" stroke-width="3.5"/>
  <circle cx="96" cy="80" r="5" fill="#465060" stroke="#A8B2C0" stroke-width="1.5"/>
  <line x1="82" y1="68" x2="76" y2="42" stroke="#788394" stroke-width="3" stroke-linecap="round"/>
  <line x1="73" y1="36" x2="77" y2="48" stroke="#00E298" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Chain -->
  <line x1="82" y1="68" x2="66" y2="68" stroke="#DCE4F0" stroke-width="2" stroke-linecap="round"/>

  <!-- Seat -->
  <line x1="34" y1="84" x2="48" y2="84" stroke="#C8D0DC" stroke-width="4" stroke-linecap="round"/>

  <!-- Stick Figure Rower in Drive Form -->
  <g stroke="#00E298" fill="#00E298" stroke-linecap="round" stroke-linejoin="round">
    <!-- Legs -->
    <polyline points="41,82 57,66 59,92" fill="none" stroke-width="6"/>
    <!-- Torso -->
    <line x1="41" y1="82" x2="52" y2="48" stroke-width="7"/>
    <!-- Arms -->
    <line x1="52" y1="48" x2="66" y2="68" stroke-width="5"/>
    <!-- Head -->
    <circle cx="56" cy="34" r="9" stroke="none"/>
  </g>
  <!-- Handle grip -->
  <line x1="66" y1="64" x2="66" y2="72" stroke="#F5C346" stroke-width="3.5" stroke-linecap="round"/>
</svg>
